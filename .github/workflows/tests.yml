# SPDX-License-Identifier: AGPL-3.0-or-later
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # redis-stack-server provides RediSearch, which the index tests need.
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          # The chunking tests tokenise for real, so the model must be present.
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Run tests
        env:
          VISUALWEAVER_TEST_REDIS_HOST: 127.0.0.1
          VISUALWEAVER_TEST_REDIS_PORT: 6390
        run: python -m pytest tests/ -q --durations=10

      - name: Run the Redis tests with no pinned port
        # The run above never exercises the bootstrap that starts a private
        # server: it takes the "port supplied by the environment" branch. That
        # left the guard against the default returning to the app's own port
        # armed nowhere but a developer laptop.
        #
        # Installs `redis`, not `redis-stack-server`: Redis stopped publishing
        # redis-stack for noble (ubuntu-latest is 24.04), and Redis 8 ships the
        # query engine that used to require it.
        #
        # REQUIRED=1 turns a failed boot into an error. Without it every guard
        # skips when no server starts, and pytest exits 0 on an all-skipped run —
        # so the step would pass while proving nothing.
        env:
          VISUALWEAVER_TEST_REDIS_REQUIRED: "1"
        run: |
          set -euo pipefail
          curl -fsSL https://packages.redis.io/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/redis.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y redis
          redis-server --version
          # Where the distribution put the query engine. conftest starts its own
          # server with no config file, so it must load the module by path — the
          # first run of this job failed because it only knew the vendored one.
          # Printed unconditionally so a miss is answerable from a single run.
          echo "--- redis module locations ---"
          ls -l /usr/lib/redis/modules/ 2>/dev/null || echo "  no /usr/lib/redis/modules"
          find / -name '*search*.so' -path '*redis*' 2>/dev/null | head -5 || true
          python -m pytest tests/test_test_cleanup.py tests/test_workflow_backend.py \
                           tests/test_usage_tracking.py -q

      - name: Check the app imports and the CLI is wired
        # Wrapped in `timeout`: cli() once ignored sys.argv and started a server
        # on --help, which blocked this step for 22 minutes until the job-level
        # timeout cancelled the whole run. A hang here must fail in seconds.
        run: |
          timeout 60 python -c "import visualweaver.main; print('import ok')"
          timeout 60 visualweaver --help > /dev/null && echo "cli ok"
          timeout 60 visualweaver --version
