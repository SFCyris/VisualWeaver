# oauth2-proxy in front of VisualWeaver (OIDC: Google, Microsoft Entra ID, Keycloak,
# GitLab, …). Used by docker-compose.oauth2-proxy.yml; see DOCS.md → "Sign-in through a
# reverse proxy". Fill in the provider settings for your identity provider as the
# oauth2-proxy documentation describes.

http_address        = "0.0.0.0:4180"
upstreams           = ["http://visualweaver:8420/"]

provider            = "oidc"
oidc_issuer_url     = "https://login.example.com/realms/example"
client_id           = "visualweaver"
# client_secret and cookie_secret come from the environment
# (OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET).
redirect_url        = "https://visualweaver.example.com/oauth2/callback"
email_domains       = ["example.com"]
scope               = "openid email profile groups"

cookie_secure       = true
# Pass the signed-in user to VisualWeaver: X-Forwarded-User, X-Forwarded-Email,
# X-Forwarded-Groups, X-Forwarded-Preferred-Username. Copies of these a browser sent
# itself are removed (skip_auth_strip_headers, on by default).
pass_user_headers   = true
skip_auth_strip_headers = true
pass_host_header    = true
reverse_proxy       = true
